<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CI/CD Engineering — PDF 24: Continuous Deployment</title>
<style>
/* cover signature marker: <span class="sig">Nabawy</span> */
:root{--paper:#f5f6f4;--white:#fff;--ink:#161a19;--muted:#68706d;--line:#d5dad7;--panel:#111614;--text-light:#e8eeeb;--text-muted:#9ca8a3;--accent:#00b87c;--accent-dark:#008f61}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0f0e;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)}
@page{size:A4;margin:0}
.page{width:210mm;min-height:297mm;padding:16mm 16mm 19mm;margin:8mm auto;position:relative;background:var(--paper);page-break-after:always;overflow:hidden;display:flex;flex-direction:column}
@media print{body{background:#fff}.page{margin:0;box-shadow:none}h3.sec,.phead h2{break-after:avoid}.qa,.kv,.vflow{break-inside:avoid}}
.phead{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.phead .ch{color:var(--accent-dark);font-weight:700}
.phead h2{font-size:22px;letter-spacing:1px;color:var(--ink);margin:2px 0 6px;text-transform:uppercase}
.phead hr{border:none;border-top:1.5px solid var(--ink);margin-bottom:10px}
.pfoot{margin-top:auto;padding-top:8px;font-size:9px;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--line);letter-spacing:1px}
h3.sec{font-size:23px;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px;break-after:avoid}
h3.sec .n{color:var(--accent-dark);font-family:"Cascadia Code",Consolas,monospace;font-size:15px;margin-right:10px}
p.body{font-size:14.5px;line-height:1.6;margin:8px 0}
code,.mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,monospace}
.cover{background:var(--panel);color:var(--text-light);justify-content:center}
.cover .brand{font-size:10px;letter-spacing:4px;color:var(--text-muted)}
.cover h1{font-size:44px;line-height:1.08;margin:10px 0 4px;letter-spacing:1px}
.cover h1 span{color:var(--accent)}
.cover .sub{font-size:15px;color:var(--text-muted);margin-bottom:18px}
.cover .tri{font-size:10px;letter-spacing:2.5px;color:var(--accent);margin-bottom:26px;line-height:2}
.cover .foot{font-size:9px;color:var(--text-muted);letter-spacing:2px;margin-top:auto;padding-top:20px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.cover .sig{font-family:"Brush Script MT","Segoe Script","Snell Roundhand",cursive;font-size:26px;color:var(--accent);transform:rotate(-4deg);text-shadow:0 0 14px rgba(0,184,124,.45);white-space:nowrap}
.opener .bignum{font-size:64px;font-weight:800;line-height:1}
.opener .ctitle{font-size:26px;letter-spacing:3px;margin:2px 0 12px}
.opener .lede{font-size:18px;line-height:1.65;max-width:155mm;margin:8px 0}
.opener .lede em{color:var(--accent-dark);font-style:normal;font-weight:700}
.vflow{margin:10px 0}
.fnode{background:var(--white);border:1px solid var(--line);padding:10px 14px;font-size:12.5px;display:flex;align-items:center;gap:10px}
.fnode img{width:24px;height:24px;flex:none}
.fnode b{letter-spacing:1px;font-size:12px}
.fnode small{color:var(--muted);font-size:11px}
.farrow{text-align:center;color:var(--accent-dark);font-weight:700;line-height:1.1;padding:1px 0}
.kv{background:var(--white);border:1px solid var(--line);padding:10px 12px;margin:8px 0;font-size:13px;line-height:1.65}
.kv b{color:var(--accent-dark)}
ul.tight{font-size:13px;line-height:1.7;margin:8px 0 8px 20px}
ul.tight li{margin-bottom:4px}
.qa{background:var(--white);border:1px solid var(--line);padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.65}
.qa .qq{font-weight:700}.qa .aa{color:var(--accent-dark);font-weight:700}
.printnote{font-size:10px;color:var(--muted);border:1px dashed var(--line);padding:10px 12px;margin-top:12px;line-height:1.7}
/* m-reflow: screen-only mobile reflow; print unaffected */
@media screen and (max-width:700px){.page{width:auto;min-height:0;margin:0 auto;padding:16px 14px 20px}h3.sec{font-size:19px}.opener .bignum{font-size:48px}.cover h1{font-size:32px}.cover .tri{font-size:9px}table.cmp{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}.terminal{font-size:10.5px}.vnode b,.fnode b{font-size:11px}.phead h2{font-size:18px}.step{font-size:12.5px}}

.cover .vnode img{filter:drop-shadow(0 0 0.9px #18E299) drop-shadow(0 0 4px rgba(24,226,153,.22));}
.cover .vnode img[src*="github"]{background:none;border-radius:0;padding:0;box-shadow:none;filter:drop-shadow(0 0 0.9px #18E299) drop-shadow(0 0 5px rgba(24,226,153,.28));}
.cover .vnode img[src*="github"]{background:none;border-radius:0;padding:0;box-shadow:none;filter:drop-shadow(1px 0 0 white) drop-shadow(-1px 0 0 white) drop-shadow(0 1px 0 white) drop-shadow(0 -1px 0 white) drop-shadow(0.7px 0.7px 0 white) drop-shadow(-0.7px -0.7px 0 white) drop-shadow(-0.7px 0.7px 0 white) drop-shadow(0.7px -0.7px 0 white);}
